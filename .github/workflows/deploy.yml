name: Deploy

# Só master. Lint → testes → deploy (cada job depende do anterior).
on:
  push:
    branches: [master]

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Testes
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

  cloudflare:
    name: Deploy Cloudflare
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validar secrets do GitHub
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL vazio em Settings → Secrets → Actions (aba Secrets, não Variables)"
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::Secret JWT_SECRET precisa ter pelo menos 32 caracteres"
            exit 1
          fi
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::Secret TURNSTILE_SECRET_KEY obrigatório em produção (captcha no login)"
            exit 1
          fi
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::Secret TURNSTILE_SITE_KEY obrigatório em produção"
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      - name: Sync Worker secrets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const secrets = {
            DATABASE_URL: process.env.DATABASE_URL,
            JWT_SECRET: process.env.JWT_SECRET,
          };
          if (process.env.TURNSTILE_SECRET_KEY?.trim()) {
            secrets.TURNSTILE_SECRET_KEY = process.env.TURNSTILE_SECRET_KEY.trim();
          }
          if (process.env.TURNSTILE_SITE_KEY?.trim()) {
            secrets.TURNSTILE_SITE_KEY = process.env.TURNSTILE_SITE_KEY.trim();
          }
          fs.writeFileSync('wrangler-secrets.json', JSON.stringify(secrets));
          NODE
          npx wrangler secret bulk wrangler-secrets.json
          rm -f wrangler-secrets.json
          npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Sync Worker secrets again
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const secrets = {
            DATABASE_URL: process.env.DATABASE_URL,
            JWT_SECRET: process.env.JWT_SECRET,
          };
          if (process.env.TURNSTILE_SECRET_KEY?.trim()) {
            secrets.TURNSTILE_SECRET_KEY = process.env.TURNSTILE_SECRET_KEY.trim();
          }
          if (process.env.TURNSTILE_SITE_KEY?.trim()) {
            secrets.TURNSTILE_SITE_KEY = process.env.TURNSTILE_SITE_KEY.trim();
          }
          fs.writeFileSync('wrangler-secrets.json', JSON.stringify(secrets));
          NODE
          npx wrangler secret bulk wrangler-secrets.json
          rm -f wrangler-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
